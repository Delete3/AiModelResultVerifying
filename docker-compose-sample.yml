# 啟動開發環境：
# docker compose -f docker-compose.yml up -d
# docker exec -it ai-verifying bash

# 停止開發環境：
# docker compose -f docker-compose.yml down

services:
  verifying-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-verifying
    volumes:
      # 掛載整個專案目錄，實現熱更新
      - .:/app
    working_dir: /app
    ports:
      - "5174:5173"
    environment:
      - NODE_ENV=development
      # Vite runs inside this container, while FlowToothSDF publishes port 8010
      - DIRECTION_API_URL=http://host.docker.internal:8000
      - MARGIN_V6_API_URL=http://host.docker.internal:8011
      - MARGIN_V8_API_URL=http://host.docker.internal:8012
      # on the Docker host.
      - FLOWTOOTH_API_URL=http://host.docker.internal:8010
      # the pinned production instance, for comparison against dev above
      - FLOWTOOTH_PROD_API_URL=http://host.docker.internal:8013
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    command: npm run dev
